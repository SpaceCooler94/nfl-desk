<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NFL Desk · Game Sheet</title>
<style>
:root{--bg:#0a0c10;--card:#12151c;--ink:#f3f5f8;--mute:#8b93a2;--line:#232833;--pink:#ff2d7b;--good:#3DDC97;--bad:#e35d6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:22px 18px 48px}
.kicker{display:flex;justify-content:space-between;align-items:center}
.kicker-l{font-size:11px;letter-spacing:.12em;color:var(--mute);font-weight:700}
.kicker-l b{background:#1b1f28;color:#fff;padding:3px 7px;border-radius:4px;margin-right:8px}
.logo{font-weight:800;font-size:22px}.logo span{color:var(--pink)}
h1{font-size:34px;line-height:1.05;margin:10px 0 6px}
.meta{color:var(--mute);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.teams{display:grid;grid-template-columns:1fr 52px 1fr;margin:18px 0 12px;border-radius:10px;overflow:hidden}
.side{padding:16px 18px}
.lab{font-size:10px;letter-spacing:.14em;opacity:.8}.nm{font-size:22px;font-weight:800}.imp{font-size:11px;opacity:.85;margin-top:2px}
.at{display:grid;place-items:center;font-weight:800;background:#0a0c10}
.pills{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}
.pill .k{font-size:10px;color:var(--mute);letter-spacing:.12em}.pill .v{font-size:15px;font-weight:800;margin-top:4px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.ph{display:flex;justify-content:space-between;margin-bottom:8px}
.ph h2{margin:0;font-size:13px;letter-spacing:.08em}
.ph h2:before{content:"";display:inline-block;width:3px;height:12px;background:var(--pink);margin-right:8px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px}th{font-size:10px;color:var(--mute);letter-spacing:.1em;text-align:left}
td{border-top:1px solid var(--line)}.num{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;gap:10px;align-items:center}.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800}
.pn{font-weight:700}.ps{font-size:11px;color:var(--mute)}
.gap.pos{color:var(--good);font-weight:700}.gap.neg{color:var(--bad);font-weight:700}.grade{font-weight:800;color:var(--pink)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mrow{display:flex;justify-content:space-between;padding:8px 4px;border-top:1px solid var(--line)}
.badge{min-width:34px;text-align:center;font-weight:800;padding:4px 6px;border-radius:6px}
.badge.g{background:#14351f;color:#3DDC97}.badge.y{background:#3a3210;color:#e8c547}.badge.r{background:#3a1515;color:#ff6b6b}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.nav button{background:#12151c;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:12px/1 system-ui;cursor:pointer}
.nav button.on{border-color:#ff2d7b}
.foot{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;margin-top:10px}.foot b{color:var(--pink)}
.err{color:var(--bad)}
@media(max-width:720px){.pills,.cols{grid-template-columns:1fr 1fr}.teams{grid-template-columns:1fr}.at{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker"><div class="kicker-l"><b id="weektag">WEEK</b> NFL · GAME SHEET</div><div class="logo"><span>x</span>DESK</div></div>
  <div class="nav" id="games"></div>
  <h1 id="title">Loading</h1>
  <div class="meta" id="when"></div>
  <div class="teams" id="banner"></div>
  <div class="pills" id="pills"></div>
  <div class="panel"><div class="ph"><h2>PROPS AT A GLANCE</h2><div class="ps">PROJ VS LINE</div></div>
    <table><thead><tr><th>PLAYER</th><th class="num">PROJ</th><th class="num">LINE</th><th class="num">GAP</th><th class="num">GRADE</th></tr></thead><tbody id="props"></tbody></table>
  </div>
  <div class="panel"><div class="ph"><h2>KEY MATCHUPS</h2></div><div class="cols" id="looks"></div></div>
  <div class="foot"><div><b>desk</b> · research</div><div id="stamp"></div></div>
</div>
<script>
const FEED="https://raw.githubusercontent.com/SpaceCooler94/nfl-desk/main/feed/current.json";
const NAMES={DET:"LIONS",BUF:"BILLS",CAR:"PANTHERS",ATL:"FALCONS",MIN:"VIKINGS",CHI:"BEARS",PHI:"EAGLES",TEN:"TITANS",PIT:"STEELERS",NE:"PATRIOTS",GB:"PACKERS",NYJ:"JETS",CLE:"BROWNS",TB:"BUCCANEERS",NO:"SAINTS",BAL:"RAVENS",CIN:"BENGALS",HOU:"TEXANS",JAX:"JAGUARS",DEN:"BRONCOS",LV:"RAIDERS",LAC:"CHARGERS",MIA:"DOLPHINS",SF:"49ERS",SEA:"SEAHAWKS",ARI:"CARDINALS",WSH:"COMMANDERS",DAL:"COWBOYS",IND:"COLTS",KC:"CHIEFS",NYG:"GIANTS",LAR:"RAMS"};
const COLORS={ARI:["#97233F","#000000"],ATL:["#A71930","#000000"],BAL:["#241773","#9E7C0C"],BUF:["#00338D","#C60C30"],CAR:["#0085CA","#101820"],CHI:["#0B162A","#C83803"],CIN:["#FB4F14","#000000"],CLE:["#311D00","#FF3C00"],DAL:["#003594","#869397"],DEN:["#002244","#FB4F14"],DET:["#0076B6","#B0B7BC"],GB:["#203731","#FFB612"],HOU:["#03202F","#A71930"],IND:["#002C5F","#A2AAAD"],JAX:["#006778","#D7A22A"],KC:["#E31837","#FFB81C"],LV:["#000000","#A5ACAF"],LAC:["#0080C6","#FFC20E"],LAR:["#003594","#FFA300"],MIA:["#008E97","#FC4C02"],MIN:["#4F2683","#FFC62F"],NE:["#002244","#C60C30"],NO:["#101820","#D3BC8D"],NYG:["#0B2265","#A71930"],NYJ:["#125740","#FFFFFF"],PHI:["#004C54","#A5ACAF"],PIT:["#101820","#FFB612"],SF:["#AA0000","#B3995D"],SEA:["#002244","#69BE28"],TB:["#D50A0A","#34302B"],TEN:["#0C2340","#4B92DB"],WSH:["#5A1414","#FFB612"]};
const state={card:null,gid:null};
function nameOf(ab){return NAMES[ab]||ab||"";}
function palette(ab){return COLORS[ab]||["#1d232d","#8b93a2"];}
function inkFor(hex){const h=String(hex||"").replace("#","");if(h.length<6)return"#f3f5f8";const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return((r*299+g*587+b*114)/1000)>155?"#0a0c10":"#f3f5f8";}
function sideStyle(ab,align){const c=palette(ab);return "background:linear-gradient(90deg,"+c[0]+","+c[1]+");color:"+inkFor(c[0])+";"+(align==="right"?"text-align:right;":"");}
function grade(p){const z=p.sigma?Math.abs(+p.edge||0)/+p.sigma:Math.abs(+p.edge||0);if(p.play==="OVER"||p.play==="UNDER")return"A";if(p.play==="WATCH"&&z>=0.45)return"A-";if(p.play==="WATCH")return"B+";return"C";}
function fmt(n){if(n==null||Number.isNaN(+n))return"—";const v=+n;return(v>0?"+":"")+v.toFixed(1);}
function badge(score){const n=+score;return n>=70?"g":n<=20?"r":"y";}
function gamesFrom(c){const m=new Map();(c.games||[]).forEach(g=>m.set(g.id,g));(c.props||[]).forEach(p=>{if(!m.has(p.game_id))m.set(p.game_id,{id:p.game_id,away:p.team,home:p.opp,when:p.when});});return[...m.values()];}
function render(){
  const c=state.card,games=gamesFrom(c);
  if(!state.gid) state.gid=games[0]&&games[0].id;
  const g=games.find(x=>x.id===state.gid)||games[0]||{};
  const rows=(c.props||[]).filter(p=>p.game_id===g.id).sort((a,b)=>Math.abs(b.edge||0)-Math.abs(a.edge||0));
  document.getElementById("weektag").textContent=c.week?("WEEK "+c.week):"";
  document.getElementById("title").textContent=nameOf(g.away)+" AT "+nameOf(g.home);
  document.getElementById("when").textContent=[g.when||"",g.tv||"",g.venue||""].filter(Boolean).join(" · ");
  const ai=g.away_implied!=null?("IMPLIED "+g.away_implied):"";
  const hi=g.home_implied!=null?("IMPLIED "+g.home_implied):"";
  document.getElementById("banner").innerHTML='<div class="side" style="'+sideStyle(g.away,"left")+'"><div class="lab">AWAY</div><div class="nm">'+nameOf(g.away)+'</div><div class="imp">'+ai+'</div></div><div class="at">AT</div><div class="side" style="'+sideStyle(g.home,"right")+'"><div class="lab">HOME</div><div class="nm">'+nameOf(g.home)+'</div><div class="imp">'+hi+'</div></div>';
  document.getElementById("pills").innerHTML=[["SPREAD",g.spread||"—"],["TOTAL",g.total??"—"],["KICKOFF",g.when||"—"],["ROOF",g.roof||"—"]].map(([k,v])=>'<div class="pill"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>').join("");
  document.getElementById("props").innerHTML=rows.map(p=>{const pal=palette(p.team);return '<tr><td><div class="who"><div class="dot" style="background:'+pal[0]+';color:'+inkFor(pal[0])+'">'+ (p.team||"") +'</div><div><div class="pn">'+p.player+'</div><div class="ps">'+(p.pos||"")+' · '+(p.market_label||p.market)+'</div></div></div></td><td class="num">'+(p.proj??"—")+'</td><td class="num">'+(p.line??"—")+'</td><td class="num gap '+(+p.edge>=0?"pos":"neg")+'">'+fmt(p.edge)+'</td><td class="num grade">'+grade(p)+'</td></tr>';}).join("")||'<tr><td colspan="5" class="ps">No props</td></tr>';
  const looks=g.looks&&g.looks.length?g.looks:rows.slice(0,8).map(p=>({side:p.team===g.home?"home":"away",player:p.player,pos:p.pos,note:(p.market_label||p.market)+" · "+p.play,score:p.p_over!=null?Math.round(+p.p_over*100):50}));
  const col=(title,items)=>'<div><div class="ps">'+title+'</div>'+(items.map(x=>'<div class="mrow"><div><div class="pn">'+x.player+'</div><div class="ps">'+[x.pos,x.note].filter(Boolean).join(" · ")+'</div></div><div class="badge '+badge(x.score)+'">'+x.score+'</div></div>').join("")||'<div class="ps">No tagged looks</div>')+'</div>';
  document.getElementById("looks").innerHTML=col((g.home||"")+" OFFENSE VS "+(g.away||""),looks.filter(x=>x.side==="home"||x.team===g.home))+col((g.away||"")+" OFFENSE VS "+(g.home||""),looks.filter(x=>x.side==="away"||x.team===g.away));
  document.getElementById("stamp").textContent=(c.generated_at||"")+" · "+(c.status||"");
  document.getElementById("games").innerHTML=games.map(x=>{const hc=palette(x.home)[0];return '<button data-g="'+x.id+'" class="'+(x.id===state.gid?"on":"")+'" style="'+(x.id===state.gid?"border-color:"+hc:"")+'">'+x.away+" @ "+x.home+"</button>";}).join("");
  document.querySelectorAll("#games button").forEach(b=>b.onclick=()=>{state.gid=b.dataset.g;render();});
}
fetch(FEED+"?t="+Date.now()).then(r=>{if(!r.ok)throw new Error("feed "+r.status);return r.json();}).then(c=>{state.card=c;render();}).catch(e=>{document.getElementById("title").textContent="Feed failed";document.getElementById("when").innerHTML='<span class="err">'+e.message+"</span>";});
</script>
</body>
</html>
